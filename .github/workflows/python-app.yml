# CI：跑插件自包含测试套件（tests/test_obsidian_plugin.py，非 pytest 采集式）。
# 插件零额外依赖，仅需本体同款 httpx。

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install "httpx>=0.28.1" flake8
      - name: Lint (syntax errors and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run self-contained tests
        run: python tests/test_obsidian_plugin.py
